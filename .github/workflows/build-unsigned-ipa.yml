# Build an UNSIGNED Porthole IPA on GitHub's macOS runners.
#
# Purpose: the Simplified Chinese (zh-Hans) localization can be built by
# people who have no Mac. The resulting .ipa is unsigned, exactly like the
# upstream releases (see docs/INSTALL.md): you sign it with your own
# certificate / sideloader before installing it on an iPhone or iPad.
#
# ============================================================================
# RUNTIME STAGING — the approach changed (see REPORT3.md for the audit):
#
# app/project.yml references 14 resources under app/RuntimeStage/Resources/
# plus static libs in app/RuntimeStage/lib. Without them
# `xcodegen generate` fails before any compilation. The previous workflow
# tried to build the Madeira runtime from source on the runner
# (continue-on-error); that path takes hours and upstream itself says a
# clean-machine rebuild "has not been done yet" (docs/SOURCE.md).
#
# NEW DEFAULT: .github/scripts/stage_from_release_ipa.sh downloads the
# UPSTREAM OFFICIAL RELEASE IPA of the SAME version as this source tree
# (v1.3.1, build 928), verifies it against the release's own SHA-256,
# extracts it, and copies the runtime resources it already ships into
# app/RuntimeStage/Resources/. All 14 items were audited present in that
# IPA (one, x86_64-vcruntime, is an empty folder in the official build by
# design — Microsoft's VC runtime is not bundled, the app downloads it).
# The app itself is still compiled from this repository's sources; only
# the prebuilt runtime payload is reused. Porthole/Madeira are GPL-3.0
# and their source is this repo + the pinned vendor/Madeira submodule.
#
# KNOWN GAP that remains: static libraries (RuntimeStage/lib/*.a) are NOT
# in any IPA — they are linked into the official executable. The staging
# script copies the few archives tracked in the Madeira snapshot
# (libgmp/libgnutls/libhogweed/libnettle); the rest (-lntdll_unix,
# -lwin32u_unix, -lwineserver, -ldxmt_combined, -lavcodec, ...) come only
# from the from-source build. So the xcodebuild LINK step may still fail
# until those are built. To run that old path, dispatch this workflow
# with build_runtime_from_source=true (it is off for push events and by
# default, so routine runs no longer burn hours before failing).
#
# Other known risks:
# - This workflow has NOT been verified end-to-end (drafted on Linux).
# - StikJIT is NOT in git: tools/prepare_stikjit.py downloads it into
#   app/Vendor/ (digest-checked). That step is included below.
# - Xcode version: upstream develops against Xcode 27 (docs/SOURCE.md).
#   GitHub's macos-latest image may ship an older Xcode; the setup step
#   picks the newest Xcode installed on the image, which may still be
#   too old for some sources.
# ============================================================================

name: Build unsigned IPA (zh-Hans)

on:
  workflow_dispatch:
    inputs:
      build_runtime_from_source:
        description: "Also build the Madeira runtime from source (hours, unverified) instead of only staging resources from the official release IPA"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/scripts/stage_from_release_ipa.sh"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 350   # only the optional from-source runtime build needs this; IPA-staged runs should be far shorter

    steps:
      - name: Check out (with Madeira submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode on the image
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch StikJIT into app/Vendor (digest-checked, not in git)
        run: python3 tools/prepare_stikjit.py

      # ---- Default runtime staging: reuse the official release IPA ----
      - name: Stage runtime resources from official release IPA
        run: .github/scripts/stage_from_release_ipa.sh

      # ---- Optional: build the Madeira runtime from source ----
      # The old best-effort path, kept only as a manual opt-in. It patches
      # and builds Wine/FEX/DXMT/FFmpeg/... and finishes with
      # tools/stage_runtime.sh, which REPLACES the IPA staging above with
      # locally built libraries (including RuntimeStage/lib). Long and
      # fragile on a clean runner; expect to iterate on it.
      - name: Build Madeira runtime from source and re-stage (opt-in)
        if: ${{ inputs.build_runtime_from_source }}
        run: |
          git -C vendor/Madeira apply --whitespace=nowarn ../../patches/0172-engine-r28-madeira.patch
          git -C vendor/Madeira/FEX apply --whitespace=nowarn ../../../patches/0173-engine-r28-fex.patch
          git -C vendor/Madeira/wine apply --whitespace=nowarn ../../../patches/0174-engine-r28-wine.patch
          git -C vendor/Madeira/dxmt apply --whitespace=nowarn ../../../patches/0175-engine-r28-dxmt.patch
          git -C vendor/Madeira/madeira-dock apply --whitespace=nowarn ../../../patches/0176-engine-r28-madeira-dock.patch
          tools/build_wineserver_base.sh
          tools/build_dxmt_shader_headers.sh && tools/apply_dxmt_patch.sh
          tools/apply_madeira_patch.sh
          tools/build_fex_ios.sh
          # then the build/<name>/build.sh scripts in vendor/Madeira
          # (ntdll-unix, win32u-unix, wineserver, dxmt-ios, ffmpeg,
          #  freetype-ios, gnutls-ios); see docs/SOURCE.md / docs/REBUILD.md.
          tools/stage_runtime.sh

      - name: Create local build config
        run: cp app/Config/Local.xcconfig.example app/Config/Local.xcconfig

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build app (unsigned, Release)
        working-directory: app
        run: |
          xcodebuild -project Porthole.xcodeproj \
            -scheme Porthole \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Porthole.app"
          test -d "$APP" || { echo "Porthole.app not found under $APP"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # An unsigned IPA carries no _CodeSignature from this build.
          rm -rf Payload/Porthole.app/_CodeSignature
          zip -r -X "Porthole-unsigned-zh-Hans.ipa" Payload
          shasum -a 256 "Porthole-unsigned-zh-Hans.ipa" > "Porthole-unsigned-zh-Hans.ipa.sha256"
          ls -lh Porthole-unsigned-zh-Hans.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Porthole-unsigned-zh-Hans
          path: |
            Porthole-unsigned-zh-Hans.ipa
            Porthole-unsigned-zh-Hans.ipa.sha256
          if-no-files-found: error
